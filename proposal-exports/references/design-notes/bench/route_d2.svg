 class="text fill-N1" style="text-anchor:middle;font-size:28px">结论</text></g><g class="cjEuYQ=="><g class="shape" ><rect x="437" y="62" width="347" height="66" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="610.5" y="100.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">研究背景：遮挡导致单站测距掉点</text></g><g class="cjEuYg=="><g class="shape" ><rect x="804" y="62" width="489" height="66" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="1048.5" y="100.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">研究现状：国内外机构、成果、应用、论文与专利</text></g><g class="cjIuYQ=="><g class="shape" ><rect x="739" y="298" width="191" height="66" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="834.5" y="336.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">4-1 联合资源分配</text></g><g class="cjIuYg=="><g class="shape" ><rect x="950" y="298" width="212" height="66" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="1056" y="336.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">4-2 遮挡检测与替补</text></g><g class="cjIuYw=="><g class="shape" ><rect x="568" y="298" width="151" height="66" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="643.5" y="336.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">4-3 外场验证</text></g><g class="cjMuYQ=="><g class="shape" ><rect x="632" y="534" width="466" height="66" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="865" y="572.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">研究内容 → 目标与子课题；目标可量化、可验证</text></g><g class="cjQuYQ=="><g class="shape" ><rect x="765" y="770" width="182" height="66" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="856" y="808.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">遮挡 30% 有提升</text></g><g class="cjQuYg=="><g class="shape" ><rect x="967" y="770" width="174" height="66" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="1054" y="808.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">500 次蒙特卡洛</text></g><g class="cjQuYw=="><g class="shape" ><rect x="588" y="770" width="157" height="66" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="666.5" y="808.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">3 个真实场景</text></g><g class="cjUuYQ=="><g class="shape" ><rect x="655" y="1006" width="419" height="66" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="864.5" y="1044.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">8 站、100 ms 下可用率 96%；50% 遮挡需加站</text></g><g class="KHIxIC0mZ3Q7IHIyKVswXQ=="><marker id="mk-d2-1072341980-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 865 180 L 865 244" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1072341980-3488378134)" mask="url(#d2-1072341980)" /></g><g class="KHIyIC0mZ3Q7IHIzKVswXQ=="><path d="M 865 416 L 865 480" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1072341980-3488378134)" mask="url(#d2-1072341980)" /></g><g class="KHIzIC0mZ3Q7IHI0KVswXQ=="><path d="M 865 652 L 865 716" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke